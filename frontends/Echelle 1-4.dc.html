<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
</style></helmet>
<!-- Échelle 1–4 (« Saisir sans Jev », maquette 5a, 10/10/2026 : probabilité, impact) : quatre cases, chiffre et niveau en clair ;
     la case choisie en bleu nuit, les précédentes en vert pâle. Le libellé et le niveau à droite sont affichés par l'écran.
     Clavier : groupe de boutons radio, flèches. -->
<div role="radiogroup" aria-labelledby="{{ labelledBy }}" style="display:flex;gap:4px"><sc-for list="{{ dots }}" as="p" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{ p.ariaChk }}" aria-label="{{ p.aria }}" tabIndex="{{ p.tab }}" onClick="{{ p.on }}" onKeyDown="{{ onKey }}" style="{{ p.st }}" style-focus-visible="outline:2px solid #146b64;outline-offset:2px"><b style="font-size:13px;line-height:1">{{ p.n }}</b><span style="font-size:9.5px;font-weight:600;opacity:.8;white-space:nowrap">{{ p.t }}</span></button></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;labels&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;labelledBy&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n: number) =&gt; void&quot;}}">
// Composant réutilisable « Échelle 1–4 » (10/10/2026) : `labels` = libellés des niveaux 1 à 4.
class Component extends DCLogic {
  renderVals() {
    const P = this.props, cv = Number(P.value) || 0, L = P.labels || [];
    const set = n => { if (n !== cv) P.onChange?.(n); };
    const onKey = e => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
      if (!d) return;
      e.preventDefault(); const n = Math.min(4, Math.max(1, (cv || 1) + d)); set(n);
      const g = e.currentTarget.parentElement; setTimeout(() => g && g.children[n - 1] && g.children[n - 1].focus(), 0);
    };
    return {
      labelledBy: P.labelledBy, onKey,
      dots: [1, 2, 3, 4].map(n => ({ n, t: L[n - 1] || '', ariaChk: n === cv ? 'true' : 'false', aria: n + (L[n - 1] ? ' · ' + L[n - 1] : ''), tab: n === (cv || 1) ? 0 : -1, on: () => set(n),
        st: `flex:1;min-width:0;height:42px;border:0;padding:0;font-family:inherit;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;${n === cv ? 'background:#13243d;color:#fff;box-shadow:0 8px 16px -10px rgba(19,36,61,.7)' : n < cv ? 'background:#e3f2ef;color:#146b64' : 'background:#f2f6f5;color:#8a9aa6'}` })),
    };
  }
}
</script>
</body>
</html>
