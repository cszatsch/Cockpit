<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
</style></helmet>
<!-- Échelle 1–4 (« Saisir sans Jev », maquette 3a : probabilité, impact) : libellé à gauche, niveau en clair à droite, quatre cases ;
     la case choisie en encre, les précédentes en vert pâle. Clavier : groupe de boutons radio, flèches gauche / droite. -->
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;color:#43586a"><span id="{{ labelId }}" style="white-space:nowrap">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span style="color:#1d8f86"> *</span></sc-if></span><span style="font-size:11px;color:#10233a;font-weight:700;white-space:nowrap">{{ levelL }}</span></div>
  <div role="radiogroup" aria-labelledby="{{ labelId }}" style="display:flex;gap:4px"><sc-for list="{{ dots }}" as="p" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{ p.ariaChk }}" aria-label="{{ p.aria }}" tabIndex="{{ p.tab }}" onClick="{{ p.on }}" onKeyDown="{{ onKey }}" style="{{ p.st }}" style-focus-visible="outline:2px solid #146b64;outline-offset:2px">{{ p.n }}</button></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;label&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;labels&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n: number) =&gt; void&quot;}}">
// Composant réutilisable « Échelle 1–4 » (09/10/2026) : `labels` = libellés des niveaux 1 à 4.
let e4Seq = 0;
class Component extends DCLogic {
  uid = 'e4' + (++e4Seq);
  renderVals() {
    const P = this.props, cv = Number(P.value) || 0, L = P.labels || [];
    const set = n => { if (n !== cv) P.onChange?.(n); };
    const onKey = e => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
      if (!d) return;
      e.preventDefault(); const n = Math.min(4, Math.max(1, (cv || 1) + d)); set(n);
      const g = e.currentTarget.parentElement; setTimeout(() => g && g.children[n - 1] && g.children[n - 1].focus(), 0);
    };
    return {
      label: P.label, required: !!P.required, labelId: this.uid + 'l', levelL: cv ? (L[cv - 1] || '') : '', onKey,
      dots: [1, 2, 3, 4].map(n => ({ n, ariaChk: n === cv ? 'true' : 'false', aria: n + (L[n - 1] ? ' · ' + L[n - 1] : ''), tab: n === (cv || 1) ? 0 : -1, on: () => set(n),
        st: `flex:1;height:30px;border:0;padding:0;font-family:inherit;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;${n === cv ? 'background:#10233a;color:#fff' : n < cv ? 'background:#e3f1ee;color:#1d8f86' : 'background:#f3f6f5;color:#8a9aa6'}` })),
    };
  }
}
</script>
</body>
</html>
