<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#f2f6f5;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
*{box-sizing:border-box}button{font-family:inherit;color:inherit}
a{color:#1d8f86}a:hover{color:#146b64}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
</style></helmet>
<div style="display:flex;flex-direction:column;gap:16px" data-screen-label="Initialisation d’un projet">

  <nav aria-label="Étapes de l’initialisation" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px #e1e9e7,0 1px 2px rgba(16,35,58,.04);padding:14px 16px 16px">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
      <button onClick="{{ s.go }}" disabled="{{ s.dis }}" aria-current="{{ s.cur }}" title="{{ s.tip }}" style="{{ s.st }}" style-hover="{{ s.hov }}">
        <span style="display:block;height:3px;border-radius:3px;background:#e4ecea;overflow:hidden"><span style="{{ s.fill }}"></span></span>
        <span style="display:flex;align-items:center;gap:10px;min-width:0">
          <span style="{{ s.dot }}">{{ s.g }}</span>
          <span style="display:flex;flex-direction:column;min-width:0;text-align:left"><span style="{{ s.lSt }}">{{ s.l }}</span><span style="font-size:11.5px;color:#8a9aa6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.d }}</span></span>
        </span>
      </button>
    </sc-for>
  </nav>

  <sc-if value="{{ isPrev }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:16px;animation:rise .35s ease both">
      <div style="position:relative;overflow:hidden;background:#10233a;border-radius:20px;padding:24px 28px;color:#fff;display:flex;align-items:center;gap:22px;flex-wrap:wrap">
        <span style="position:absolute;inset:0;background:radial-gradient(600px 200px at 85% -20%,rgba(61,214,198,.18),transparent 70%)"></span>
        <span style="position:relative;width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.06em;flex:none;color:#9fe7de">{{ pj.code }}</span>
        <div style="position:relative;flex:1;min-width:220px"><div style="font-size:21px;font-weight:800;letter-spacing:-.02em">{{ pj.name }}</div><div style="font-size:12.5px;color:#b9cad5;margin-top:4px">{{ pj.sub }}</div></div>
        <div style="position:relative;display:flex">
          <sc-for list="{{ pj.kpis }}" as="k" hint-placeholder-count="4"><div style="padding:0 18px;border-left:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:flex-end"><span style="font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1">{{ k.v }}</span><span style="font-size:11px;color:#9fb3c1;font-weight:700;white-space:nowrap">{{ k.l }}</span></div></sc-for>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start">
        <div style="background:#fff;border-radius:16px;box-shadow:0 0 0 1px #e1e9e7;padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px">
          <div style="padding:8px 10px 8px;display:flex;align-items:baseline"><span style="font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#8a9aa6">RÉFÉRENTIEL</span><span style="flex:1"></span><span style="font-size:11px;font-weight:700;color:#8a9aa6;font-variant-numeric:tabular-nums;white-space:nowrap">{{ visL }}</span></div>
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="10"><button onClick="{{ t.pick }}" style="{{ t.st }}" style-hover="{{ t.hov }}"><span style="{{ t.mark }}"></span><span style="flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.l }}</span><span style="{{ t.nSt }}">{{ t.n }}</span></button></sc-for>
        </div>
        <div style="background:#fff;border-radius:16px;box-shadow:0 0 0 1px #e1e9e7;overflow:hidden">
          <div style="padding:16px 20px;border-bottom:1px solid #eef3f2;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span style="font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap">{{ view.t }}</span><span style="font-size:12px;color:#8a9aa6">{{ view.d }}</span></div>
          <sc-if value="{{ view.isPlan }}" hint-placeholder-val="{{ false }}">
            <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px">
              <div style="position:relative;height:18px;margin-left:190px"><sc-for list="{{ view.years }}" as="y" hint-placeholder-count="3"><span style="{{ y.st }}">{{ y.l }}</span></sc-for></div>
              <sc-for list="{{ view.bars }}" as="b" hint-placeholder-count="6"><div style="display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;align-items:center;height:30px"><span style="{{ b.lSt }}">{{ b.l }}</span><div style="position:relative;height:100%;border-radius:6px;background:#f5f8f7"><div style="{{ b.st }}" title="{{ b.t }}"></div></div></div></sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ view.isForm }}" hint-placeholder-val="{{ false }}">
            <div style="padding:6px 20px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 28px"><sc-for list="{{ view.fields }}" as="f" hint-placeholder-count="8"><div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f4"><span style="color:#5c7280;flex:none;white-space:nowrap">{{ f.l }}</span><span style="font-weight:700;text-align:right;min-width:0;text-wrap:pretty">{{ f.v }}</span></div></sc-for></div>
          </sc-if>
          <sc-if value="{{ view.isGrid }}" hint-placeholder-val="{{ true }}">
            <div style="overflow-x:auto"><div style="{{ view.minW }}">
              <div style="{{ view.gridHead }}"><sc-for list="{{ view.heads }}" as="h" hint-placeholder-count="5"><span style="{{ h.st }}">{{ h.l }}</span></sc-for></div>
              <sc-for list="{{ view.rows }}" as="r" hint-placeholder-count="6"><div style="{{ view.gridRow }}" style-hover="background:#fafcfb"><sc-for list="{{ r.c }}" as="c" hint-placeholder-count="5"><span style="{{ c.st }}">{{ c.v }}</span></sc-for></div></sc-for>
              <sc-if value="{{ view.more }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 20px;font-size:12px;color:#8a9aa6">{{ view.moreL }}</div></sc-if>
            </div></div>
          </sc-if>
        </div>
      </div>
      <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><span role="alert" style="align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:9px;background:#fdf1ef;font-size:12.5px;color:#a2352a;font-weight:700">{{ errL }}</span></sc-if>
      <div style="position:sticky;bottom:12px;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px 14px 20px;border-radius:16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px #e1e9e7,0 18px 40px -24px rgba(16,35,58,.45)">
        <span style="width:8px;height:8px;border-radius:50%;background:#f0a13a;box-shadow:0 0 0 4px rgba(240,161,58,.16);flex:none"></span>
        <span style="flex:1;min-width:260px;font-size:12.5px;color:#43586a;line-height:1.5;text-wrap:pretty">{{ confirmL }}</span>
        <button onClick="{{ back }}" style="height:40px;padding:0 14px;border-radius:10px;border:1px solid #d3dedb;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s" style-hover="border-color:#10233a"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg>Contrôle</button>
        <button onClick="{{ doImport }}" style="height:40px;padding:0 18px;border-radius:10px;border:0;background:linear-gradient(90deg,#f7a41c,#f0752b);color:#10233a;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 10px 22px -12px rgba(240,117,43,.9);transition:filter .15s,transform .15s" style-hover="filter:brightness(1.05);transform:translateY(-1px)">Valider l’importation</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff;border-radius:20px;box-shadow:0 0 0 1px #e1e9e7;padding:34px 34px 30px;display:flex;flex-direction:column;gap:30px;animation:rise .35s ease both">
      <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#8a9aa6">IMPORTATION EN COURS</span><span style="font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums">{{ pct }}</span></div>
          <div style="display:flex;flex-direction:column;gap:3px;padding-bottom:5px;min-width:0"><span style="font-weight:800;font-size:14px">{{ busyL }}</span><span style="font-size:12.5px;color:#5c7280">{{ busyD }}</span></div>
        </div>
      </sc-if>
      <sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
          <span style="width:56px;height:56px;border-radius:50%;flex:none;background:#1d8f86;display:grid;place-items:center;box-shadow:0 0 0 8px #e6f4f2;animation:pop .45s ease both"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:8px">
            <span style="font-size:21px;font-weight:800;letter-spacing:-.02em">{{ doneT }}</span>
            <span style="font-size:13px;color:#5c7280;max-width:620px;line-height:1.55;text-wrap:pretty">{{ doneD }}</span>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
              <button onClick="{{ restart }}" style="height:40px;padding:0 14px;border-radius:10px;border:1px solid #d3dedb;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .15s" style-hover="border-color:#10233a">Importer un autre projet</button>
              <button onClick="{{ openLib }}" style="height:40px;padding:0 16px;border-radius:10px;border:0;background:#10233a;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 18px -10px rgba(16,35,58,.7)" style-hover="background:#17405a">Ouvrir la bibliothèque<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg></button>
            </div>
          </div>
        </div>
      </sc-if>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px">
        <sc-for list="{{ phases }}" as="p" hint-placeholder-count="5">
          <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
            <span style="display:block;height:3px;border-radius:3px;background:#e4ecea;overflow:hidden"><span style="{{ p.fill }}"></span></span>
            <span style="display:flex;align-items:center;gap:8px;min-width:0"><span style="{{ p.dot }}"></span><span style="{{ p.lSt }}">{{ p.l }}</span></span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

const SH = [['01 Équipes', 'Équipes'], ['02 Rôles', 'Rôles'], ['03 Personnes', 'Personnes'], ['04 Affectations', 'Affectations'], ['05 Projet', 'Projet'], ['06 Info projet', 'Info projet'], ['07 Lots', 'Lots'], ['08 Phases', 'Phases'], ['09 Sous-phases', 'Sous-phases'], ['10 Chantiers', 'Chantiers'], ['11 Instances', 'Instances'], ['12 Membres', 'Membres'], ['13 Jalons', 'Jalons'], ['14 Livrables', 'Livrables']];
const D = (y, m, d) => new Date(y, m - 1, d);
