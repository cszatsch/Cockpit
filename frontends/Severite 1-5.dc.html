<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.sv-step{transition:background .18s}
.sv-bar{transition:background .2s,height .2s}
.sv-step:hover .sv-bar{filter:brightness(.96)}
@media (prefers-reduced-motion:reduce){.sv-step,.sv-bar{transition:none!important}}
</style></helmet>
<!-- Sévérité 1–5 (« Saisir sans Jev », formulaire Problème, 16/10/2026) : cinq marches de hauteur croissante, colorées jusqu'au
     niveau choisi (ambre de 1 à 3, rouge à 4 et 5, comme le tableau des problèmes) ; sous l'escalier, le niveau et son sens.
     Clavier : groupe de boutons radio, flèches. -->
<div style="display:flex;flex-direction:column;gap:10px">
  <div role="radiogroup" aria-labelledby="{{ labelledBy }}" style="display:flex;align-items:flex-end;gap:6px;height:50px">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5"><button type="button" class="sv-step" role="radio" aria-checked="{{ s.ariaChk }}" aria-label="{{ s.aria }}" tabIndex="{{ s.tab }}" onClick="{{ s.on }}" onKeyDown="{{ onKey }}" style="{{ s.st }}" style-focus-visible="outline:2px solid #146b64;outline-offset:2px"><span class="sv-bar" style="{{ s.bar }}"></span><span style="{{ s.numSt }}">{{ s.n }}</span></button></sc-for>
  </div>
  <div aria-live="polite" style="display:flex;align-items:baseline;gap:8px;min-height:18px;font-size:12.5px;line-height:1.4">
    <b style="{{ lvlSt }}">{{ lvl }}</b><span style="color:#5c7280">{{ sense }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;labelledBy&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n: number) =&gt; void&quot;}}">
// Composant réutilisable « Sévérité 1–5 » (16/10/2026) : niveaux, sens et couleurs d'un problème.
const SEV = [
  ['Mineure', 'Gêne ponctuelle, contournement simple', '#e9c27d'],
  ['Modérée', 'Ralentit une équipe, sans menacer d’échéance', '#e4a447'],
  ['Sérieuse', 'Menace une échéance du chantier', '#e08a1e'],
  ['Majeure', 'Menace un jalon ou plusieurs chantiers', '#d4574a'],
  ['Bloquante', 'Arrête le chantier : arbitrage immédiat', '#b8352c'],
];
class Component extends DCLogic {
  renderVals() {
    const P = this.props, cv = Math.min(5, Math.max(0, Number(P.value) || 0)), col = cv ? SEV[cv - 1][2] : '#e6edeb';
    const set = n => { if (n !== cv) P.onChange?.(n); };
    const onKey = e => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
      if (!d) return;
      e.preventDefault(); const n = Math.min(5, Math.max(1, (cv || 1) + d)); set(n);
      const g = e.currentTarget.parentElement; setTimeout(() => g && g.children[n - 1] && g.children[n - 1].focus(), 0);
    };
    return {
      labelledBy: P.labelledBy, onKey,
      lvl: cv ? 'S' + cv + ' · ' + SEV[cv - 1][0] : 'Choisir une sévérité', sense: cv ? SEV[cv - 1][1] : '',
      lvlSt: 'white-space:nowrap;font-weight:800;color:' + (cv >= 4 ? '#b8352c' : cv ? '#8f5d0e' : '#8a9aa6'),
      steps: [1, 2, 3, 4, 5].map(n => ({ n, ariaChk: n === cv ? 'true' : 'false', aria: 'Sévérité ' + n + ' · ' + SEV[n - 1][0] + ' : ' + SEV[n - 1][1], tab: n === (cv || 1) ? 0 : -1, on: () => set(n),
        st: 'flex:1;min-width:0;height:100%;border:0;padding:0 0 2px;background:transparent;font-family:inherit;border-radius:8px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:4px;cursor:pointer',
        bar: 'display:block;border-radius:4px;height:' + (6 + n * 5) + 'px;background:' + (n <= cv ? col : '#e6edeb'),
        numSt: 'font-size:10.5px;font-weight:' + (n === cv ? 800 : 600) + ';line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:' + (n === cv ? '#10233a' : '#8a9aa6') })),
    };
  }
}
</script>
</body>
</html>
