<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
</style></helmet>
<!-- Sélection multiple en étiquettes (« Saisir sans Jev », maquette 3a) : étiquettes retirables, « Ajouter », liste à cocher qui reste
     ouverte ; « Transverse » précédé d'un filet. Clavier : Entrée / Espace / flèche bas ouvrent, flèches parcourent, Entrée coche, Échap ferme. -->
<div ref="{{ rootRef }}" style="position:relative;display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;color:#43586a"><span id="{{ labelId }}" style="white-space:nowrap">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span style="color:#1d8f86"> *</span></sc-if></span></div>
  <div role="combobox" tabIndex="0" aria-labelledby="{{ labelId }}" aria-expanded="{{ ariaOpen }}" aria-controls="{{ listId }}" aria-activedescendant="{{ activeId }}" aria-required="{{ ariaReq }}" onClick="{{ toggle }}" onKeyDown="{{ onKey }}" style="{{ boxSt }}" style-focus-visible="outline:2px solid #146b64;outline-offset:2px">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="2"><span style="height:28px;padding:0 4px 0 10px;border-radius:7px;background:#eef5f3;color:#10233a;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap">{{ c.t }}<button type="button" onClick="{{ c.rm }}" aria-label="{{ c.rmL }}" title="Retirer" style="width:20px;height:20px;border:0;padding:0;background:none;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#5c7280;cursor:pointer" style-hover="background:#dcebe7;color:#10233a" style-focus-visible="outline:2px solid #146b64;outline-offset:1px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-for>
    <span style="font-size:12.5px;color:#8a9aa6;font-weight:500;padding-left:4px;white-space:nowrap">Ajouter</span>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;flex:none" aria-hidden="true"><path d="{{ ic }}"></path></svg>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div id="{{ listId }}" role="listbox" aria-multiselectable="true" aria-labelledby="{{ labelId }}" style="position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:#fff;border-radius:12px;padding:5px;box-shadow:0 0 0 1px #e3ebe9,0 18px 36px -16px rgba(16,35,58,.35);display:flex;flex-direction:column;max-height:260px;overflow:auto"><sc-for list="{{ opts }}" as="o" hint-placeholder-count="4"><sc-if value="{{ o.sep }}" hint-placeholder-val="{{ false }}"><span role="presentation" style="flex:none;height:1px;background:#eef3f2;margin:4px 6px"></span></sc-if><div id="{{ o.id }}" role="option" aria-selected="{{ o.ariaSel }}" onClick="{{ o.on }}" onMouseEnter="{{ o.hover }}" style="{{ o.st }}"><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.t }}</span><sc-if value="{{ o.chk }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1d8f86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></div></sc-for></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;label&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ v: string; t: string; sep?: boolean; exclusive?: boolean }[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v: string[]) =&gt; void&quot;}}">
// Composant réutilisable « Sélection multiple en étiquettes » (09/10/2026). Une option `exclusive` (« Transverse ») remplace
// les autres quand on la coche ; cocher une autre option la retire.
let ceSeq = 0;
class Component extends DCLogic {
  state = { open: false, active: -1 };
  rootRef = React.createRef();
  uid = 'ce' + (++ceSeq);
  componentDidMount() { this._out = e => { if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.setState({ open: false }); }; document.addEventListener('mousedown', this._out); }
  componentWillUnmount() { document.removeEventListener('mousedown', this._out); }
  toggleOpt(o) {
    const O = this.props.options || [], cur = this.props.value || [], on = cur.includes(o.v), ex = new Set(O.filter(x => x.exclusive).map(x => x.v));
    const next = on ? cur.filter(x => x !== o.v) : o.exclusive ? [o.v] : cur.filter(x => !ex.has(x)).concat([o.v]);
    this.props.onChange?.(next);
  }
  renderVals() {
    const P = this.props, S = this.state, O = P.options || [], cur = P.value || [], open = S.open;
    const set = (open, active) => this.setState({ open, active });
    const onKey = e => {
      const k = e.key, idx = Math.max(0, S.active);
      if (!open && (k === 'Enter' || k === ' ' || k === 'ArrowDown')) { e.preventDefault(); set(true, 0); return; }
      if (!open) return;
      if (k === 'Escape' || k === 'Tab') { if (k === 'Escape') e.preventDefault(); set(false, -1); }
      else if (k === 'ArrowDown') { e.preventDefault(); set(true, Math.min(O.length - 1, idx + (S.active < 0 ? 0 : 1))); }
      else if (k === 'ArrowUp') { e.preventDefault(); set(true, Math.max(0, idx - 1)); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); if (O[idx]) this.toggleOpt(O[idx]); }
    };
    const label = v => (O.find(o => o.v === v) || { t: v }).t;
    return {
      label: P.label, required: !!P.required, ariaReq: P.required ? 'true' : 'false', labelId: this.uid + 'l', listId: this.uid + 'x', open, ariaOpen: open ? 'true' : 'false',
      activeId: open && S.active >= 0 ? this.uid + 'o' + S.active : undefined, onKey,
      toggle: () => set(!open, 0), ic: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      boxSt: `display:flex;align-items:center;gap:10px;min-height:42px;flex-wrap:wrap;padding:6px 12px 6px 6px;border:1px solid ${open ? '#1d8f86' : '#dfe7e5'};border-radius:10px;background:#fff;${open ? 'box-shadow:0 0 0 3px rgba(29,143,134,.12);' : ''}cursor:pointer;outline:none`,
      chips: cur.map(v => ({ t: label(v), rmL: 'Retirer ' + label(v), rm: e => { e.stopPropagation(); this.props.onChange?.(cur.filter(x => x !== v)); } })),
      opts: O.map((o, i) => { const chk = cur.includes(o.v), act = i === S.active;
        return { t: o.t, sep: !!o.sep, chk, ariaSel: chk ? 'true' : 'false', id: this.uid + 'o' + i, on: e => { e.stopPropagation(); this.toggleOpt(o); }, hover: () => this.setState({ active: i }),
          st: `display:flex;align-items:center;gap:10px;flex:none;height:34px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:${chk ? 700 : 500};color:${chk ? '#10233a' : '#43586a'};${act ? 'background:#f4f8f7' : ''}` }; }),
    };
  }
}
</script>
</body>
</html>
