<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}input{font-family:inherit}input::placeholder{color:#8a9aa6}
</style></helmet>
<!-- Ligne de critère d'une option d'arbitrage (« Saisir sans Jev », maquette 5a, 10/10/2026) : repliée, intitulé (et description),
     poids et note ; dépliée (un critère à la fois), rang, intitulé, poids (%), suppression, note de 1 à 4 (un second clic sur la note
     choisie la retire) et son libellé, description. -->
<div>
  <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ open }}" aria-expanded="false" aria-label="{{ openL }}" style="width:100%;display:grid;grid-template-columns:minmax(0,1fr) 46px 24px;gap:12px;align-items:center;min-height:50px;padding:6px 4px;border:0;border-top:1px solid #edf2f0;background:none;font-family:inherit;text-align:left;cursor:pointer" style-hover="background:#f8fbfa" style-focus-visible="outline:2px solid #146b64;outline-offset:-2px"><span style="min-width:0;display:flex;flex-direction:column;gap:2px"><span style="{{ cSt }}">{{ cTxt }}</span><sc-if value="{{ hasD }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:#8a9aa6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d }}</span></sc-if></span><span style="height:26px;border-radius:7px;background:#f3f6f5;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#43586a;font-variant-numeric:tabular-nums">{{ wl }}</span><span style="{{ nbSt }}">{{ nb }}</span></button></sc-if>
  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}"><div role="group" aria-label="{{ groupL }}" style="display:flex;flex-direction:column;gap:10px;padding:12px;margin:6px 0;border-radius:14px;box-shadow:inset 0 0 0 1.5px #1f9a8a;background:#fbfdfd">
    <div style="display:grid;grid-template-columns:20px minmax(0,1fr) 62px 22px;gap:8px;align-items:center">
      <span style="font-size:11px;font-weight:800;color:#b4c2c9" aria-hidden="true">{{ idx }}</span>
      <input ref="{{ cRef }}" value="{{ c }}" onChange="{{ cc }}" aria-label="{{ cL }}" placeholder="Nommer le critère" style="min-width:0;border:0;outline:0;background:none;padding:0;font-size:13.5px;font-weight:700;color:#10233a;caret-color:#1f9a8a">
      <div style="height:30px;border-radius:8px;background:#f1f5f4;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 8px" style-focus-within="box-shadow:0 0 0 1.5px #1f9a8a"><input value="{{ w }}" onChange="{{ wc }}" inputMode="numeric" aria-label="{{ wL }}" placeholder="0" style="width:28px;border:0;outline:0;background:none;padding:0;text-align:right;font-size:13px;font-weight:700;color:#10233a;font-variant-numeric:tabular-nums"><span style="font-size:12px;font-weight:600;color:#8a9aa6" aria-hidden="true">%</span></div>
      <button type="button" onClick="{{ rm }}" aria-label="{{ rmL }}" title="Supprimer le critère" style="width:22px;height:22px;border:0;padding:0;background:none;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#b4c2c9;cursor:pointer" style-hover="background:#f1f5f4;color:#43586a" style-focus-visible="outline:2px solid #146b64;outline-offset:1px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:8px"><div role="radiogroup" aria-label="{{ nL }}" style="flex:1;display:flex;gap:3px"><sc-for list="{{ segs }}" as="p" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{ p.ariaChk }}" aria-label="{{ p.aria }}" onClick="{{ p.on }}" style="{{ p.st }}" style-focus-visible="outline:2px solid #146b64;outline-offset:1px">{{ p.n }}</button></sc-for></div><span style="{{ nlSt }}">{{ nl }}</span></div>
    <input value="{{ d }}" onChange="{{ dc }}" aria-label="{{ dL }}" placeholder="Description, justification de la note" style="height:34px;border:0;outline:0;border-radius:9px;background:#f4f7f6;padding:0 10px;font-size:12.5px;font-weight:500;color:#43586a;min-width:0" style-focus-visible="box-shadow:0 0 0 1.5px #1f9a8a">
  </div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;index&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;row&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ c: string; w: string; n: number; d: string }&quot;},&quot;expanded&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(patch: object) =&gt; void&quot;},&quot;onRemove&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
// Composant réutilisable « Ligne de critère » (10/10/2026) : `row` = { c : intitulé, w : poids (texte, chiffres seuls), n : note 0 à 4,
// d : description } ; `expanded` : ligne dépliée (l'intitulé reçoit le focus à l'ouverture).
const LC_COLORS = ['#c2413b', '#b8650f', '#1f9a8a', '#0d5952'], LC_LABELS = ['Faible', 'Moyen', 'Bon', 'Excellent'];
class Component extends DCLogic {
  cRef = React.createRef();
  componentDidMount() { this.focusIfOpen(); }
  componentDidUpdate(pp) { if (this.props.expanded && !pp.expanded) this.focusIfOpen(); }
  focusIfOpen() { if (this.props.expanded) setTimeout(() => this.cRef.current && this.cRef.current.focus({ preventScroll: true }), 0); }
  renderVals() {
    const P = this.props, r = P.row || { c: '', w: '', n: 0, d: '' }, n = Number(r.n) || 0, k = (Number(P.index) || 0) + 1, nm = r.c || 'critère ' + k;
    const up = p => P.onChange?.(p), ex = !!P.expanded;
    return {
      closed: !ex, expanded: ex, cRef: this.cRef, open: () => P.onOpen?.(),
      idx: String(k).padStart(2, '0'), c: r.c, w: r.w, d: r.d, hasD: !!r.d, cTxt: r.c || 'Nommer le critère', wl: (parseInt(r.w, 10) || 0) + ' %',
      groupL: 'Critère ' + k, openL: 'Modifier ' + nm + ' · poids ' + ((parseInt(r.w, 10) || 0)) + ' % · ' + (n ? 'note ' + n + ' sur 4' : 'non noté'),
      cL: 'Intitulé du critère ' + k, wL: 'Poids de ' + nm + ' en %', nL: 'Note de ' + nm, dL: 'Description de ' + nm, rmL: 'Supprimer ' + nm,
      cc: e => up({ c: e.target.value }), wc: e => up({ w: e.target.value.replace(/\D/g, '').slice(0, 3) }), dc: e => up({ d: e.target.value }),
      rm: e => { e.stopPropagation(); P.onRemove?.(); },
      cSt: `font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${r.c ? '#10233a' : '#8a9aa6'}`,
      nb: n ? String(n) : '–', nbSt: `width:24px;height:24px;border-radius:7px;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;${n ? 'background:' + LC_COLORS[n - 1] + ';color:#fff' : 'background:#f2f6f5;color:#b4c2c9'}`,
      nl: n ? LC_LABELS[n - 1] : 'Non noté', nlSt: `font-size:11.5px;font-weight:700;white-space:nowrap;width:62px;text-align:right;color:${n ? LC_COLORS[n - 1] : '#8a9aa6'}`,
      segs: [1, 2, 3, 4].map(x => ({ n: x, ariaChk: x === n ? 'true' : 'false', aria: x + ' · ' + LC_LABELS[x - 1], on: () => up({ n: n === x ? 0 : x }),
        st: `flex:1;height:32px;border:0;padding:0;font-family:inherit;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,color .15s;${x === n ? 'background:' + LC_COLORS[x - 1] + ';color:#fff' : x < n ? 'background:#e9f2f0;color:#43586a' : 'background:#f2f6f5;color:#8a9aa6'}` })),
    };
  }
}
</script>
</body>
</html>
