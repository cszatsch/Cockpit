<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
</style></helmet>
<!-- Champ de sélection (« Saisir sans Jev », maquette 5a, 10/10/2026) : boîte grise, valeur ou texte d'aide, chevron (ou silhouette
     pour une personne) ; en choix multiple, étiquettes retirables tronquées par « … ». La liste (composant « Liste options ») s'ouvre
     sous la boîte et se referme par un clic à l'extérieur, Échap ou un choix simple. Clavier : Entrée, Espace ou flèche bas ouvrent. -->
<div ref="{{ rootRef }}" data-dd="1" style="display:flex;flex-direction:column;gap:6px;min-width:0">
  <div ref="{{ boxRef }}" role="combobox" tabIndex="0" aria-labelledby="{{ labelledBy }}" aria-haspopup="listbox" aria-expanded="{{ ariaOpen }}" aria-required="{{ ariaReq }}" onClick="{{ toggle }}" onKeyDown="{{ onKey }}" style="{{ boxSt }}" style-focus-visible="background:#fff;box-shadow:0 0 0 1.5px #1f9a8a,0 0 0 5px rgba(31,154,138,.12);outline:none">
    <sc-for list="{{ chips }}" as="x" hint-placeholder-count="1"><span title="{{ x.t }}" style="height:28px;max-width:100%;min-width:0;padding:0 4px 0 10px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px #e3ebe8;font-size:12.5px;font-weight:600;color:#10233a;display:inline-flex;align-items:center;gap:4px;white-space:nowrap"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">{{ x.t }}</span><button type="button" onClick="{{ x.rm }}" aria-label="{{ x.aria }}" title="Retirer" style="flex:none;width:20px;height:20px;border:0;padding:0;background:none;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#5c7280;cursor:pointer" style-hover="background:#eef3f2;color:#10233a" style-focus-visible="outline:2px solid #146b64;outline-offset:1px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></span></sc-for>
    <span style="{{ vSt }}">{{ txt }}</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a9aa6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none" aria-hidden="true"><path d="{{ ic }}"></path></svg>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><dc-import name="Liste options" variant="drop" auto-focus="{{ true }}" options="{{ options }}" value="{{ value }}" multi="{{ multi }}" avatars="{{ avatars }}" labelled-by="{{ labelledBy }}" on-pick="{{ pick }}" on-change="{{ change }}" on-escape="{{ escape }}" hint-size="100%,140px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string | string[]&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ v: string; t: string; sep?: boolean; exclusive?: boolean }[]&quot;},&quot;multi&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;person&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;labelledBy&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v: string | string[]) =&gt; void&quot;}}">
// Composant réutilisable « Champ de sélection » (10/10/2026) : `value` = `v` de l'option choisie, tableau si `multi` ;
// `person` : silhouette et initiales dans la liste. Une seule liste ouverte à la fois : un clic hors du champ la referme.
const CC_IC = { per: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20.5c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5', chev: 'M7 10l5 5 5-5' };
class Component extends DCLogic {
  state = { open: false };
  rootRef = React.createRef();
  boxRef = React.createRef();
  componentDidMount() {
    this._out = e => { if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('mousedown', this._out);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this._out); }
  close(refocus) { this.setState({ open: false }); if (refocus) setTimeout(() => this.boxRef.current && this.boxRef.current.focus({ preventScroll: true }), 0); }
  renderVals() {
    const P = this.props, O = P.options || [], multi = !!P.multi, V = multi ? (Array.isArray(P.value) ? P.value : []) : P.value, open = this.state.open;
    const cur = !multi && O.find(o => o.v === V), has = multi ? V.length > 0 : !!cur;
    return {
      rootRef: this.rootRef, boxRef: this.boxRef, open, ariaOpen: open ? 'true' : 'false', ariaReq: P.required ? 'true' : 'false', labelledBy: P.labelledBy,
      options: O, value: P.value, multi, avatars: !!P.person,
      toggle: () => this.setState({ open: !open }),
      onKey: e => { if (e.target !== e.currentTarget) return; if (!open && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown')) { e.preventDefault(); this.setState({ open: true }); } },
      pick: v => { if (v !== P.value) P.onChange?.(v); this.close(true); },
      change: vs => P.onChange?.(vs), escape: () => this.close(true),
      chips: multi ? V.map(v => { const o = O.find(x => x.v === v); const t = o ? o.t : v;
        return { t, aria: 'Retirer ' + t, rm: e => { e.stopPropagation(); P.onChange?.(V.filter(x => x !== v)); } }; }) : [],
      txt: multi ? (has ? '' : P.placeholder || '') : cur ? cur.t : P.placeholder || '', ic: P.person ? CC_IC.per : CC_IC.chev,
      vSt: `flex:1;min-width:${multi && has ? 0 : 40}px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:${has && !multi ? 600 : 500};color:${has && !multi ? '#10233a' : '#8a9aa6'}`,
      boxSt: `border-radius:12px;display:flex;align-items:center;gap:${multi ? 6 : 10}px;transition:box-shadow .15s,background .15s;cursor:pointer;min-width:0;outline:none;${multi ? 'min-height:46px;padding:7px 14px 7px 8px;flex-wrap:wrap;' : 'height:46px;padding:0 14px;'}${open ? 'background:#fff;box-shadow:0 0 0 1.5px #1f9a8a,0 0 0 5px rgba(31,154,138,.12)' : 'background:#f4f7f6'}`,
    };
  }
}
</script>
</body>
</html>
