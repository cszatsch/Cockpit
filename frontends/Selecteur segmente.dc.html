<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#10233a;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
</style></helmet>
<!-- Sélecteur segmenté (« Saisir sans Jev », maquette 5a, 10/10/2026 : statut, priorité, option recommandée) : segments égaux sur
     fond gris, le segment choisi en blanc ; pastille de couleur facultative par segment. Le libellé est affiché par l'écran.
     Clavier : groupe de boutons radio, flèches. -->
<div role="radiogroup" aria-labelledby="{{ labelledBy }}" style="display:flex;gap:3px;padding:3px;border-radius:12px;background:#f2f6f5"><sc-for list="{{ opts }}" as="p" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ p.ariaChk }}" tabIndex="{{ p.tab }}" onClick="{{ p.on }}" onKeyDown="{{ onKey }}" style="{{ p.st }}" style-focus-visible="outline:2px solid #146b64;outline-offset:1px"><span style="{{ p.dSt }}"></span>{{ p.t }}</button></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ t: string; dot?: string }[]&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;height&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;labelledBy&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i: number) =&gt; void&quot;}}">
// Composant réutilisable « Sélecteur segmenté » (10/10/2026) : `value` = rang du segment choisi ; `dot` : couleur de la pastille
// d'un segment (statut, priorité, option suggérée par le score) ; `height` : hauteur des segments (34 px par défaut).
class Component extends DCLogic {
  renderVals() {
    const P = this.props, O = P.options || [], cv = Number(P.value) || 0, h = Number(P.height) || 34;
    const set = n => { if (n !== cv) P.onChange?.(n); };
    const onKey = e => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
      if (!d) return;
      e.preventDefault(); const n = (cv + d + O.length) % O.length; set(n);
      const g = e.currentTarget.parentElement; setTimeout(() => g && g.children[n] && g.children[n].focus(), 0);
    };
    return {
      labelledBy: P.labelledBy, onKey,
      opts: O.map((o, n) => ({ t: o.t, ariaChk: n === cv ? 'true' : 'false', tab: n === cv ? 0 : -1, on: () => set(n),
        dSt: o.dot ? `width:6px;height:6px;border-radius:50%;flex:none;background:${o.dot}` : 'display:none',
        st: `flex:1;min-width:0;height:${h}px;border:0;padding:0 4px;font-family:inherit;background:none;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;white-space:nowrap;cursor:pointer;transition:background .15s;${n === cv ? 'background:#fff;color:#10233a;font-weight:700;box-shadow:0 1px 2px rgba(19,36,61,.08),0 0 0 1px #e3ebe8' : 'color:#5c7280;font-weight:600'}` })),
    };
  }
}
</script>
</body>
</html>
